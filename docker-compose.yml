name: test-assignment-blog

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: test-assignment-blog-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - blog

  php:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: test-assignment-blog-php
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./src:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - blog

  scss:
    image: node:24-alpine
    container_name: test-assignment-blog-scss
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /work
    volumes:
      - ./assets/scss:/work/scss:ro
      - ./src/public/css:/work/css
      - scss-npm-cache:/.npm
    command: sh -c "npm install --prefix /tmp sass && /tmp/node_modules/.bin/sass --watch --no-source-map scss/main.scss:css/main.css"
    networks:
      - blog

  mysql:
    image: mysql:8.4
    container_name: test-assignment-blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - blog

networks:
  blog:
    driver: bridge

volumes:
  mysql-data:
  scss-npm-cache:
